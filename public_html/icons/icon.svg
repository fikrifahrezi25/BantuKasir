<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" fill="#17613f" rx="80"/>
  
  <!-- Cash Register Icon -->
  <g transform="translate(106, 106)">
    <!-- Top display -->
    <rect x="50" y="20" width="200" height="60" rx="8" fill="#ffffff" opacity="0.9"/>
    <text x="150" y="60" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#17613f" text-anchor="middle">BK</text>
    
    <!-- Main body -->
    <rect x="20" y="100" width="260" height="180" rx="12" fill="#ffffff" opacity="0.95"/>
    
    <!-- Keyboard buttons -->
    <g fill="#17613f" opacity="0.8">
      <circle cx="60" cy="140" r="12"/>
      <circle cx="100" cy="140" r="12"/>
      <circle cx="140" cy="140" r="12"/>
      <circle cx="180" cy="140" r="12"/>
      <circle cx="220" cy="140" r="12"/>
      
      <circle cx="60" cy="180" r="12"/>
      <circle cx="100" cy="180" r="12"/>
      <circle cx="140" cy="180" r="12"/>
      <circle cx="180" cy="180" r="12"/>
      <circle cx="220" cy="180" r="12"/>
      
      <circle cx="60" cy="220" r="12"/>
      <circle cx="100" cy="220" r="12"/>
      <circle cx="140" cy="220" r="12"/>
      <circle cx="180" cy="220" r="12"/>
      <circle cx="220" cy="220" r="12"/>
    </g>
    
    <!-- Cash drawer -->
    <rect x="20" y="290" width="260" height="40" rx="8" fill="#ffffff" opacity="0.9"/>
    <line x1="30" y1="310" x2="270" y2="310" stroke="#17613f" stroke-width="2" opacity="0.6"/>
  </g>
</svg>
